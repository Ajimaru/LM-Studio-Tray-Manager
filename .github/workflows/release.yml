name: Release Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # workflow_dispatch passes the branch name here, never a tag, so this
      # would always fail a manual run. Manual runs are for exercising the
      # build; only a tag push produces a release.
      - name: Validate tag format
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

      - name: Build release artifacts using Docker (tools/Dockerfile.release)
        run: |
          set -euo pipefail
          docker build -f tools/Dockerfile.release -t lmstudio-release:latest .

          # Extract artifacts from Docker image
          CONTAINER_ID=$(docker create lmstudio-release:latest)
          trap "docker rm -f $CONTAINER_ID" EXIT

          # Copy artifacts from container (they are stored in /workspace/release/)
          docker cp "$CONTAINER_ID":/workspace/release dist

          echo "✅ Artifacts extracted to dist/"
          ls -lh dist/

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          # On a manual run GITHUB_REF_NAME is the branch, so fall back to
          # the VERSION file the build actually used.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d ' \t\n\r' < VERSION)"
            VERSION="${VERSION#v}"
          fi

          # Verify all expected artifacts exist
          APPIMAGE="dist/lmstudio-tray-manager-${VERSION}-linux-x86_64.AppImage"
          SOURCE_TAR="dist/lmstudio-tray-manager-${VERSION}-linux-x86_64.tar.gz"
          BINARY_TAR="dist/lmstudio-tray-manager-${VERSION}-linux-x86_64-binary.tar.gz"
          CHECKSUMS="dist/SHA256SUMS.txt"

          echo "Verifying Linux artifacts..."
          [[ -f "$APPIMAGE" ]] || { echo "❌ AppImage missing: $APPIMAGE"; exit 1; }
          [[ -f "$SOURCE_TAR" ]] || { echo "❌ Source tarball missing: $SOURCE_TAR"; exit 1; }
          [[ -f "$BINARY_TAR" ]] || { echo "❌ Binary tarball missing: $BINARY_TAR"; exit 1; }
          [[ -f "$CHECKSUMS" ]] || { echo "❌ Checksums missing: $CHECKSUMS"; exit 1; }

          echo "✅ All Linux artifacts present"
          echo
          echo "Checksums:"
          cat "$CHECKSUMS"
          echo
          echo "Artifact sizes:"
          ls -lh "$APPIMAGE" "$SOURCE_TAR" "$BINARY_TAR" | awk '{print $9, "("$5")"}'

      # A manual run must not create a release named after the branch.
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS.txt

  build-macos:
    runs-on: macos-latest
    needs: build-and-release
    env:
      NOTARY_PROFILE: LMSTUDIO_TRAY_NOTARY

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Import Developer ID certificate
        id: import-cert
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE_BASE64:-}" || -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "sign_identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            KEYCHAIN_PASSWORD="${GITHUB_RUN_ID}"
          fi

          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          CERT_PATH="$CERT_PATH" python - <<'PY'
          import base64
          import os
          from pathlib import Path

          certificate_base64 = os.environ["MACOS_CERTIFICATE_BASE64"]
          certificate_path = Path(os.environ["CERT_PATH"])
          certificate_path.write_bytes(base64.b64decode(certificate_base64))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ {print $2; exit}')
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "❌ Developer ID Application identity not found"
            exit 1
          fi

          echo "::add-mask::$SIGN_IDENTITY"
          echo "sign_identity=$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Store notarization credentials
        id: notary
        env:
          SIGN_IDENTITY: ${{ steps.import-cert.outputs.sign_identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
        run: |
          set -euo pipefail

          if [[ -z "${SIGN_IDENTITY:-}" || -z "${APPLE_ID:-}" || -z "${APPLE_TEAM_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" ]]; then
            echo "profile_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "profile_ready=true" >> "$GITHUB_OUTPUT"

      - name: Build macOS release artifacts
        env:
          SIGN_IDENTITY: ${{ steps.import-cert.outputs.sign_identity }}
          NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
          NOTARY_READY: ${{ steps.notary.outputs.profile_ready }}
        run: |
          set -euo pipefail

          chmod +x tools/build_macos.sh
          build_args=(--clean)

          if [[ -n "${SIGN_IDENTITY:-}" ]]; then
            build_args+=(--sign-identity "$SIGN_IDENTITY")
          fi

          if [[ "${NOTARY_READY:-}" == "true" ]]; then
            build_args+=(--notary-profile "$NOTARY_PROFILE")
          fi

          ./tools/build_macos.sh "${build_args[@]}"

      - name: Verify macOS artifacts
        run: |
          set -euo pipefail

          shopt -s nullglob
          dmg=(release/lmstudio-tray-manager-*-macos-*.dmg)
          tarball=(release/lmstudio-tray-manager-*-macos-*.tar.gz)

          [[ ${#dmg[@]} -gt 0 ]] || { echo "❌ DMG missing"; exit 1; }
          [[ ${#tarball[@]} -gt 0 ]] || { echo "❌ Tarball missing"; exit 1; }
          [[ -f release/SHA256SUMS-macos.txt ]] || {
            echo "❌ Checksums missing"; exit 1; }

          # Never publish an unsigned build: it would fail Gatekeeper and
          # send users back to the xattr workaround. The build script marks
          # those with an -unsigned suffix.
          for f in "${dmg[@]}" "${tarball[@]}"; do
            case "$f" in
              *-unsigned.*)
                echo "❌ Unsigned artifact would be published: $f"
                echo "   Check the signing secrets for this repository."
                exit 1
                ;;
            esac
          done

          # Signed is not enough - the notarization ticket has to be
          # stapled, or offline machines still see a warning.
          xcrun stapler validate "${dmg[0]}"
          xcrun stapler validate dist/LM-Studio-Tray-Manager.app
          spctl -a -t open --context context:primary-signature \
            -vvv "${dmg[0]}"

          ls -lh release/lmstudio-tray-manager-*-macos-*
          cat release/SHA256SUMS-macos.txt

      - name: Upload macOS artifacts
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            release/lmstudio-tray-manager-*-macos-*.dmg
            release/lmstudio-tray-manager-*-macos-*.tar.gz
            release/SHA256SUMS-macos.txt
