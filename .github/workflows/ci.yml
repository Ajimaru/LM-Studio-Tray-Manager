# CI workflow runs syntax validation and unit tests with coverage
name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # allow manual invocation from Actions tab for testing
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      # check out repository code
      - name: Checkout
        uses: actions/checkout@v7

      # prepare Python environment for later checks
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ensure main python script compiles
      - name: Python syntax check (tray-app)
        run: python -m py_compile lmstudio_tray.py

      # also check auxiliary Python modules
      - name: Python syntax check (build_binary)
        run: python -m py_compile tools/build_binary.py

      # verify shell script syntax
      - name: Bash syntax check
        run: |
          bash -n lmstudio_autostart.sh
          bash -n setup.sh
          bash -n tools/build.sh
          bash -n tools/build_macos.sh

      # install shellcheck if not available
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      # lint the shell scripts
      - name: Shellcheck
        run: shellcheck lmstudio_autostart.sh setup.sh tools/build.sh tools/build_macos.sh

      # try to run the build script to make sure the binary can be produced
      # only run this if every previous step in the job succeeded (shellcheck,
      # syntax checks, etc.). a failing step aborts the job by default, but
      # adding the explicit condition makes the intent clear.
      - name: Build binary
        if: ${{ success() }}
        run: |
          bash tools/build.sh
          test -f dist/lmstudio-tray-manager

      # exercise the generated executable to ensure it starts and returns 0
      - name: Smoke‑run built binary
        run: |
          chmod +x dist/lmstudio-tray-manager
          ./dist/lmstudio-tray-manager --version
          ./dist/lmstudio-tray-manager --help

      # invoke autostart helper in a non‑destructive mode (list-models)
      # this doesn't actually launch LM Studio, but confirms the script runs and
      # the Python helper is reachable
      - name: Run autostart script in list-models mode
        run: |
          if command -v llmster >/dev/null 2>&1 || command -v lms >/dev/null 2>&1; then
              bash lmstudio_autostart.sh --list-models || true
          else
              echo "skipping autostart invocation (no llmster/lms installed)"
          fi
          python -m lmstudio_tray --help

  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ensure the python sources compile under a Windows interpreter,
      # where the tray takes its pystray/tasklist branches
      - name: Python syntax check
        run: |
          python -m py_compile lmstudio_tray.py
          python -m py_compile tools/build_binary.py

      # the PowerShell counterpart of the `bash -n` checks in `validate`
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('lmstudio_autostart.ps1', 'tools/build_windows.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$file::$($errors.Count) parse error(s)"
              $errors | ForEach-Object {
                Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      # the PowerShell counterpart of shellcheck
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      # -Path takes a single string, not a list, so each file is analyzed on
      # its own. -EnableExit reports the finding count as the exit code, and
      # a non-zero code from any file has to survive the loop.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = 0
          foreach ($file in @('lmstudio_autostart.ps1', 'tools/build_windows.ps1')) {
            $results = Invoke-ScriptAnalyzer -Path $file -Severity Error, Warning
            foreach ($result in $results) {
              $findings++
              Write-Host "::error file=$file,line=$($result.Line)::$($result.RuleName): $($result.Message)"
            }
          }
          if ($findings -gt 0) { exit 1 }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-build.txt
          pip install -r requirements-windows.txt

      # produce the executable the release job will ship
      - name: Build executable
        if: ${{ success() }}
        run: |
          python tools/build_binary.py
          if (-not (Test-Path dist/lmstudio-tray-manager.exe)) { exit 1 }
        shell: pwsh

      # A --windowed build detaches from the console, so PowerShell does not
      # wait for it and $LASTEXITCODE is never set. Start-Process -Wait is
      # the only way to get a real exit code back.
      - name: Smoke-run built executable
        shell: pwsh
        run: |
          foreach ($flag in @('--version', '--help')) {
            $process = Start-Process -FilePath dist/lmstudio-tray-manager.exe `
              -ArgumentList $flag -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              Write-Host "::error::$flag exited with $($process.ExitCode)"
              exit 1
            }
          }

      # the script itself always has a console, so its output can be asserted
      - name: Smoke-run from source
        run: |
          python lmstudio_tray.py --version
          python lmstudio_tray.py --help

      # exercise the autostart helper in its read-only mode. Exit code 3
      # means "no models found", which is the expected result on a runner
      # with no LM Studio installed.
      #
      # The trailing "exit 0" is load-bearing. Checking $LASTEXITCODE does
      # not clear it, and GitHub appends "exit $LASTEXITCODE" to every pwsh
      # step - so tolerating 3 here still failed the step, with no error
      # text and no annotation to explain it.
      - name: Run autostart script in list-models mode
        shell: pwsh
        run: |
          ./lmstudio_autostart.ps1 -ListModels
          $code = $LASTEXITCODE
          Write-Host "autostart -ListModels exit code: $code"
          if ($code -notin @(0, 3)) {
            Write-Host "::error::autostart -ListModels exited with $code"
            exit 1
          }
          exit 0

  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # pytest-cov is needed even though coverage is disabled below:
      # pytest.ini puts --cov in addopts, and pytest rejects the flag
      # outright when the plugin is missing.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      # Only the Windows-specific suites run here. The rest of
      # test_lmstudio_tray.py assumes a POSIX HOME and pgrep/ps throughout,
      # so it stays on the Linux `test` job, which also owns the coverage
      # gate.
      - name: Run Windows tests
        run: |
          pytest tests/test_lmstudio_tray_windows.py tests/test_lmstudio_tray_windows_tray.py --no-cov -q

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        run-coverage: [true]

    steps:
      # checkout the repo for tests
      - name: Checkout
        uses: actions/checkout@v7

      # set up same Python version
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # install test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      # execute unit tests and collect coverage
      - name: Run tests (with coverage)
        if: ${{ matrix.run-coverage }}
        run: |
          pytest --cov-report=xml:coverage.xml

      # send coverage report to Codecov
      - name: Upload coverage to Codecov
        if: ${{ matrix.run-coverage && github.repository == 'Ajimaru/LM-Studio-Tray-Manager' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      # optionally report coverage to Codacy
      - name: Upload coverage to Codacy
        if: ${{ matrix.run-coverage && github.repository == 'Ajimaru/LM-Studio-Tray-Manager' }}
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: ${{ vars.CODACY_ORGANIZATION_PROVIDER }}
          CODACY_USERNAME: ${{ vars.CODACY_USERNAME }}
          CODACY_PROJECT_NAME: ${{ vars.CODACY_PROJECT_NAME }}
        continue-on-error: true
        run: |
          # -t expects a *repository* token. An account token is picked up
          # from CODACY_API_TOKEN together with the provider, username and
          # project name above; passing it via -t makes the reporter look up
          # a project that does not exist ("Request URL not found").
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
